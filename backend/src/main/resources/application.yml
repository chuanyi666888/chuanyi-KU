server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: smart-grain-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smartgrain.domain.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义业务配置（可被环境变量覆盖）
smartgrain:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string-at-least-32-bytes}
    access-token-ttl: 7200        # 秒，2 小时
    refresh-token-ttl: 604800     # 秒，7 天
    header: Authorization
    prefix: "Bearer "
  login:
    max-fail-count: 5
    lock-minutes: 15
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allow-credentials: true
  backup:
    mysql-root: ${BACKUP_MYSQL_ROOT:/data/backups/mysql}
    kingbase-root: ${BACKUP_KB_ROOT:/data/backups/kingbase}
    script-dir: ${BACKUP_SCRIPT_DIR:/opt/smartgrain/scripts/backup}
    enable-trigger: ${BACKUP_ENABLE_TRIGGER:true}
    script-timeout-sec: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.smartgrain: DEBUG
    org.springframework.security: INFO
